<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Whispering Death</title>
<meta name="description" content="Whispering Death">
<meta name="theme-color" content="#0c0907">
<meta property="og:type" content="profile">
<meta property="og:title" content="Whispering Death">
<meta property="og:image" content="https://raw.githubusercontent.com/mdimrankhanalpha/Whispering-Death/main/1792164327845.jpg">
<meta property="og:url" content="https://mdimrankhanalpha.github.io/Whispering-Death/">
<meta name="twitter:card" content="summary_large_image">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="hero">
  <div class="hero-bg" aria-hidden="true"></div>
  <button class="avatar" id="avatar" type="button" aria-label="View profile photo">
    <img id="avatar-img" alt="Whispering Death">
  </button>
  <h1 id="name">Whispering Death</h1>
  <p class="tag" id="tag" hidden></p>
  <div class="meta">
    <span id="count"></span>
    <button class="pill" id="share" type="button">Share profile</button>
  </div>
</header>

<main class="feed-wrap">
  <div id="feed"></div>
  <div id="sentinel" aria-hidden="true"></div>
  <p id="status" class="note" role="status">Loading…</p>
</main>

<div id="lb" class="lb" hidden role="dialog" aria-modal="true" aria-label="Photo viewer">
  <div class="lb-bar">
    <span id="lb-count"></span>
    <a id="lb-orig" href="#" target="_blank" rel="noopener noreferrer">Open original</a>
    <button id="lb-close" class="lb-close" type="button" aria-label="Close">&times;</button>
  </div>
  <div class="lb-stage" id="lb-stage"><img id="lb-img" alt=""></div>
  <button id="lb-prev" class="lb-nav prev" type="button" aria-label="Previous photo">&lsaquo;</button>
  <button id="lb-next" class="lb-nav next" type="button" aria-label="Next photo">&rsaquo;</button>
</div>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script src="script.js" defer></script>
</body>
</html>
